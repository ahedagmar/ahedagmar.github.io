media:
  input: images
  output: /images
content:
- name: home
  label: Home
  type: file
  path: content/home.json
  format: json
  fields:
  - name: portrait
    type: image
    label: Homepage photograph
  - name: portrait_size
    label: Homepage photograph size
    type: select
    default: L
    options:
      values:
      - XS
      - S
      - M
      - L
      - XL
  - name: short_bio
    type: text
    label: HOME — short biography
  - name: works_heading
    type: string
    label: Homepage project list heading (Here)
- name: projects
  label: Projects
  type: file
  path: content/projects.json
  format: json
  list: true
  fields:
  - name: published
    type: boolean
    label: Published
  - name: selected
    label: Selected
    type: boolean
    default: true
  - name: title
    type: string
    required: true
  - name: slug
    type: string
    required: true
    label: Unique URL name (lowercase and hyphens)
  - name: year
    type: string
  - name: category
    type: string
  - name: location
    type: string
  - name: institution
    type: string
  - name: collaborators
    type: string
  - name: material
    type: string
  - name: dimensions
    type: string
  - name: status
    type: string
  - name: photography
    type: string
  - name: credits
    type: text
  - name: description
    type: text
  - name: external_link
    type: string
  - name: pdf
    type: file
  - name: cover
    type: image
    label: Cover photograph
  - name: cover_caption
    type: string
  - name: gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{image}'
    fields:
    - name: image
      type: image
    - name: caption
      type: string
- name: news
  label: Updates
  type: file
  path: content/news.json
  format: json
  list: true
  fields:
  - name: title
    type: string
    required: true
  - name: date
    type: date
  - name: description
    type: text
  - name: published
    type: boolean
    label: Show on website
  - name: type
    type: string
    label: Category (e.g. Exhibition, Publication, Presentation, Workshop)
  - name: end_date
    type: date
  - name: location
    type: string
  - name: institution
    type: string
  - name: venue
    type: string
  - name: participants
    type: string
  - name: curator
    type: string
  - name: publisher
    type: string
  - name: credits
    type: string
  - name: external_link
    type: string
  - name: cover_caption
    type: string
  - name: cover
    type: image
  - name: gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{image}'
    fields:
    - name: image
      type: image
    - name: caption
      type: string
  - name: pdf
    type: file
- name: notebook
  label: ¿? — Notebook
  type: file
  path: content/notebook.json
  format: json
  list: true
  fields:
  - name: title
    type: string
  - name: date
    type: date
  - name: show_date
    type: boolean
    label: Show date
  - name: text
    type: text
  - name: gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{image}'
    fields:
    - name: image
      type: image
    - name: caption
      type: string
  - name: size
    type: select
    options:
      values:
      - extra-small
      - small
      - medium
      - large
      - extra-large
    label: Image size
    default: medium
  - name: alignment
    type: select
    options:
      values:
      - auto
      - left
      - centre
      - right
    label: Position
    default: auto
  - name: overlap
    label: Maximum overlap (%)
    type: select
    default: '10'
    options:
      values:
      - '0'
      - '5'
      - '10'
      - '15'
      - '20'
    description: Only image-only posts can overlap. Text and captions remain clear.
  - name: external_link
    type: string
  - name: published
    type: boolean
    default: true
- name: about
  label: About
  type: file
  path: content/about.json
  format: json
  fields:
  - name: name
    type: string
    label: Name
  - name: location
    type: string
    label: Location
  - name: about_portrait
    type: image
    label: About photograph (optional)
  - name: full_bio
    type: text
    label: ABOUT — full biography
  - name: email
    type: string
    label: Public contact email
  - name: instagram
    type: string
  - name: cv
    type: file
    label: CV PDF
  - name: education
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} — {year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
  - name: experience
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} — {year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
  - name: awards
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} — {year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
  - name: workshops
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} — {year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
