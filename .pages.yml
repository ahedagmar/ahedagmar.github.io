media:
  input: images
  output: /images

content:
  - name: site
    label: Home & About — separate biographies
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        type: string
        label: Name

      - name: location
        type: string
        label: Location

      - name: portrait
        type: image
        label: Homepage photograph

      - name: bio
        type: text
        label: Legacy biography (fallback for existing content)

      - name: email
        type: string
        label: Public contact email

      - name: short_bio
        type: text
        label: HOME — short biography

      - name: full_bio
        type: text
        label: ABOUT — full biography

      - name: about_portrait
        type: image
        label: About photograph (optional)

      - name: works_heading
        type: string
        label: Homepage project list heading

      - name: instagram
        type: string

      - name: cv
        type: file
        label: CV PDF

      - name: education
        type: object
        list: true
        fields:
          - name: year
            type: string
          - name: title
            type: string
          - name: institution
            type: string
          - name: description
            type: text

      - name: experience
        type: object
        list: true
        fields:
          - name: year
            type: string
          - name: title
            type: string
          - name: institution
            type: string
          - name: description
            type: text

      - name: awards
        type: object
        list: true
        fields:
          - name: year
            type: string
          - name: title
            type: string
          - name: institution
            type: string
          - name: description
            type: text

      - name: workshops
        type: object
        list: true
        fields:
          - name: year
            type: string
          - name: title
            type: string
          - name: institution
            type: string
          - name: description
            type: text

  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: title
        type: string
        required: true

      - name: slug
        type: string
        required: true
        label: Unique URL name (lowercase and hyphens)

      - name: year
        type: string

      - name: category
        type: string

      - name: description
        type: text

      - name: credits
        type: text

      - name: cover
        type: image
        label: Cover photograph

      - name: gallery
        type: object
        list: true
        fields:
          - name: image
            type: image
          - name: caption
            type: string

      - name: published
        type: boolean
        label: Show on website

      - name: location
        type: string

      - name: collaborators
        type: string

      - name: institution
        type: string

      - name: material
        type: string

      - name: dimensions
        type: string

      - name: status
        type: string

      - name: photography
        type: string

      - name: external_link
        type: string

      - name: cover_caption
        type: string

      - name: pdf
        type: file

  - name: news
    label: News & exhibitions
    type: file
    path: content/news.json
    format: json
    list: true
    fields:
      - name: title
        type: string
        required: true

      - name: date
        type: date

      - name: description
        type: text

      - name: published
        type: boolean
        label: Show on website

      - name: type
        type: select
        options:
          values:
            - Exhibition
            - Publication
            - Workshop
            - Residency
            - Award
            - Other

      - name: end_date
        type: date

      - name: location
        type: string

      - name: institution
        type: string

      - name: venue
        type: string

      - name: participants
        type: string

      - name: curator
        type: string

      - name: publisher
        type: string

      - name: credits
        type: string

      - name: external_link
        type: string

      - name: cover_caption
        type: string

      - name: cover
        type: image

      - name: gallery
        type: object
        list: true
        fields:
          - name: image
            type: image
          - name: caption
            type: string

      - name: pdf
        type: file