
media:
  input: images
  output: /images

content:
  - name: site
    label: About & Site Information
    type: file
    path: content/site.json
    format: json
    fields:
      - {name: name, type: string}
      - {name: location, type: string}
      - {name: portrait, type: image}
      - {name: bio, type: text}
      - {name: email, type: string}

  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - {name: title, type: string}
      - {name: slug, type: string}
      - {name: year, type: string}
      - {name: category, type: string}
      - {name: description, type: text}
      - {name: credits, type: text}
      - {name: cover, type: image}
      - name: gallery
        type: object
        list: true
        fields:
          - {name: image, type: image}
          - {name: caption, type: string}
      - {name: published, type: boolean}

  - name: news
    label: News & Exhibitions
    type: file
    path: content/news.json
    format: json
    list: true
    fields:
      - {name: title, type: string}
      - {name: date, type: date}
      - {name: description, type: text}
      - {name: published, type: boolean}
