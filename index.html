<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dagmar von der Ahe — Portfolio</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#242424;font:15px/1.5 Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}a:hover,button:hover{text-decoration:underline}header,main,footer{max-width:1600px;margin:auto;padding:24px 4vw}header,footer,.bar{display:flex;justify-content:space-between;gap:20px;align-items:center}nav{display:flex;gap:24px}header{position:sticky;top:0;background:#faf9f6;z-index:3}main{min-height:75vh}.hero{display:grid;grid-template-columns:1fr 1fr;gap:8vw;align-items:start;margin:48px 0 100px}.intro{font-size:clamp(23px,3vw,44px);line-height:1.18;letter-spacing:-.035em;max-width:650px;margin:0}.preview,.photo{aspect-ratio:4/3;background:#e9e6df;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;font-size:12px}.preview img,.photo img{width:100%;height:100%;object-fit:cover}.bar{padding-bottom:14px;border-bottom:1px solid #aaa}.switch{display:flex;gap:12px}.active{text-decoration:underline;text-underline-offset:4px}.project{display:grid;grid-template-columns:12% 1fr 25% auto;gap:12px;padding:17px 0;border-bottom:1px solid #ccc;align-items:center}.project:hover{background:#eeece6;text-decoration:none}.project .photo{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 18px;padding-top:20px}.grid .project{display:flex;flex-wrap:wrap;border:0;padding:0;gap:8px}.grid .photo{display:flex;width:100%}.grid .name{flex:1}.grid .category{width:100%;color:#666}.grid .arrow{display:none}.detail{max-width:1000px;margin:45px auto}.detail h1{font-size:clamp(32px,6vw,76px);font-weight:400;letter-spacing:-.05em;line-height:1.05}.detail p{max-width:650px;font-size:19px}.detail .photo{margin:30px 0}footer{border-top:1px solid #ccc;font-size:13px}.muted{color:#666}@media(max-width:700px){header,main,footer{padding:18px 5vw}nav{gap:12px}.hero{grid-template-columns:1fr;gap:28px;margin:30px 0 60px}.grid{grid-template-columns:repeat(2,1fr)}.project{grid-template-columns:48px 1fr auto}.project .category{display:none}.grid .category{display:block}.intro{font-size:27px}footer{flex-wrap:wrap}}
</style></head><body><header><a href="#">Dagmar von der Ahe</a><nav><a href="#works">Works</a><a href="#news">News</a><a href="#about">About</a></nav></header><main id="main"></main><footer><span>© 2026 Dagmar von der Ahe</span><span>Düsseldorf, Germany</span></footer><script>
// EDIT YOUR PROJECTS HERE. Add image paths after uploading your photographs.
const projects=[
{id:'do-not-refill',year:'2026',title:'Do Not Refill',category:'Objects',image:'',description:'An exploration of discarded nitrous oxide cylinders as a material for functional art objects.'},
{id:'stories-of-waiting',year:'2026',title:'Stories of Waiting',category:'Spatial research / Intervention',image:'',description:'A spatial investigation of waiting, access and welcome at the immigration office in Düsseldorf.'},
{id:'wachhaus',year:'2026',title:'Die verrutschte Grenze',category:'Installation',image:'',description:'A fence intersects the former guardhouse at Raketenstation Hombroich, unsettling the relationship between inside and outside.'},
{id:'athens',year:'2026',title:'Athens Central Station',category:'Architecture',image:'',description:'An architectural study of Athens Central Station.'},
{id:'valdivia',year:'2022',title:'Valdivia Cultural Centre',category:'Architecture',image:'',description:'An architectural proposal for a cultural centre in Valdivia, Chile.'}];
const main=document.querySelector('#main');let mode='index';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const photo=p=>p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}">`:`<span>${esc(p.title)} — photograph to be added</span>`;
function home(){main.innerHTML=`<section class="hero"><p class="intro">Dagmar von der Ahe is a Chilean artist and architectural designer based in Düsseldorf, working across space, material and objects.</p><div class="preview" id="preview">${photo(projects[0])}</div></section><section id="works"><div class="bar"><span>Selected works (${projects.length})</span><div class="switch"><button id="index" aria-pressed="${mode==='index'}" class="${mode==='index'?'active':''}">Index</button><button id="grid" aria-pressed="${mode==='grid'}" class="${mode==='grid'?'active':''}">Grid</button></div></div><div id="listing" class="${mode==='grid'?'grid':''}">${projects.map(p=>`<a class="project" href="#project/${p.id}" data-id="${p.id}"><div class="photo">${photo(p)}</div><span class="muted">${p.year}</span><span class="name">${esc(p.title)}</span><span class="category">${esc(p.category)}</span><span class="arrow">↗</span></a>`).join('')}</div></section>`;for(const m of ['index','grid'])document.getElementById(m).onclick=()=>{mode=m;home();document.getElementById(m).focus()};document.querySelectorAll('.project').forEach(a=>{const update=()=>document.getElementById('preview').innerHTML=photo(projects.find(p=>p.id===a.dataset.id));a.onmouseenter=update;a.onfocus=update;});}
function route(){const hash=location.hash.slice(1);const p=projects.find(p=>'project/'+p.id===hash);if(p){main.innerHTML=`<article class="detail"><a href="#works">← All works</a><h1>${esc(p.title)}</h1><span class="muted">${p.year} · ${esc(p.category)}</span><div class="photo">${photo(p)}</div><p>${esc(p.description)}</p></article>`;window.scrollTo(0,0)}else if(hash==='about'){main.innerHTML='<article class="detail"><h1>About</h1><p>Chilean artist and architectural designer based in Düsseldorf. Currently studying Baukunst at the Kunstakademie Düsseldorf.</p><p class="muted">Full biography, CV and contact details to be added.</p></article>';window.scrollTo(0,0)}else if(hash==='news'){main.innerHTML='<article class="detail"><h1>News</h1><p class="muted">Exhibitions and updates to be added.</p></article>';window.scrollTo(0,0)}else{home();if(hash==='works')document.getElementById('works').scrollIntoView();else window.scrollTo(0,0)}}window.addEventListener('hashchange',route);route();
</script></body></html>
