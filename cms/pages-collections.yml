media:
  input: images
  output: /images
content:
- name: home
  label: Home
  type: file
  path: content/home.json
  format: json
  fields:
  - name: portrait
    type: image
    label: Photograph
  - name: portrait_size
    label: Photograph size
    type: select
    default: L
    options:
      values:
      - XS
      - S
      - M
      - L
      - XL
  - name: short_bio
    type: text
    label: Description
  - name: additional_info
    label: Additional information
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.name}'
    fields:
    - name: name
      type: string
      label: Text
    - name: url
      type: string
      label: Link (optional)
- name: announcement
  label: Announcements
  type: file
  path: content/announcement.json
  format: json
  fields:
  - name: published
    type: boolean
    label: Show on website
    default: false
  - name: heading
    type: string
    label: Heading (optional)
  - name: title
    type: string
    label: Title
  - name: date
    type: string
    label: Date (free text)
  - name: location
    type: string
    label: Location
  - name: description
    type: text
    label: Description
  - name: cover
    type: image
    label: Image
  - name: hover_cover
    type: image
    label: Hover image (optional)
  - name: size
    type: select
    label: Size
    default: M
    options:
      values:
      - XS
      - S
      - M
      - L
      - XL
- name: projects
  label: Projects
  type: collection
  path: content/projects
  format: json
  fields:
  - name: published
    type: boolean
    label: Published
    default: true
  - name: selected
    label: Selected
    type: boolean
    default: true
  - name: title
    type: string
    required: true
  - name: year
    type: string
  - name: status
    type: select
    options:
      values:
      - ''
      - realized
      - unrealized
      - ongoing
      - built
      - research
      - proposal
      - academic project
    description: Optional project status.
  - name: exhibition_name
    type: string
    label: Exhibition name (optional)
  - name: location
    type: string
  - name: category
    type: string
    label: Categories (comma separated)
  - name: institution
    type: string
  - name: collaborators
    type: string
  - name: material
    type: string
  - name: dimensions
    type: string
  - name: photography
    type: string
  - name: credits
    type: text
  - name: description
    type: text
  - name: links
    label: Links
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.name}'
    fields:
    - name: name
      label: Link name
      type: string
    - name: url
      label: URL
      type: string
  - name: pdf
    type: file
  - name: cover
    type: image
    label: Cover photograph
  - name: gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{image} {youtube_url}'
    fields:
    - name: image
      type: image
    - name: youtube_url
      type: string
      label: YouTube video (optional link)
    - name: caption
      type: string
      hidden: true
    - name: video
      type: file
      label: Video (optional)
      hidden: true
    - name: alt
      type: string
      label: Alternative text
      hidden: true
    - name: layout
      type: select
      options:
        values:
        - auto
        - full
        - half
      default: auto
      hidden: true
  - name: slug
    type: string
    label: Legacy URL (preserved)
    hidden: true
  - name: cover_caption
    type: string
    hidden: true
  - name: hover_cover
    type: image
    label: Alternative cover on hover
    hidden: true
  - name: home_cover
    type: image
    label: Homepage cover
    hidden: true
  - name: related
    type: string
    label: Related project slugs (comma separated)
    hidden: true
  - name: youtube_url
    type: string
    label: YouTube URL (legacy)
    hidden: true
  filename:
    template: '{primary}.json'
    field: create
  view:
    fields:
    - title
    - year
    - published
    primary: title
    sort:
    - title
    - year
    search:
    - title
    default:
      sort: year
      order: desc
  exclude:
  - README.md
  subfolders: false
- name: notebook
  label: ¿?
  type: collection
  path: content/notebook
  format: json
  fields:
  - name: published
    type: boolean
    default: true
  - name: title
    type: string
  - name: date
    type: date
  - name: show_date
    type: boolean
    label: Show date
  - name: text
    type: text
  - name: size
    type: select
    options:
      values:
      - extra-small
      - small
      - medium
      - large
      - extra-large
    label: Image size
    default: medium
  - name: alignment
    type: select
    options:
      values:
      - auto
      - left
      - centre
      - right
    label: Position
    default: auto
  - name: links
    label: Links
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.name}'
    fields:
    - name: name
      type: string
      label: Link name
    - name: url
      type: string
      label: URL
  - name: gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.image} {fields.youtube_url}'
    fields:
    - name: image
      type: image
      label: Image
    - name: youtube_url
      type: string
      label: YouTube link
  filename:
    template: '{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json'
    field: create
  view:
    fields:
    - title
    - date
    - published
    primary: title
    sort:
    - title
    - date
    search:
    - title
    default:
      sort: date
      order: desc
  exclude:
  - README.md
  subfolders: false
- name: about
  label: About
  type: file
  path: content/about.json
  format: json
  fields:
  - name: full_bio
    type: text
    label: Description
  - name: additional_info
    label: Additional information
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.name}'
    fields:
    - name: name
      type: string
      label: Text
    - name: url
      type: string
      label: Link (optional)
  - name: exhibitions
    label: Exhibitions
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: title
      type: string
      label: Title
    - name: date
      type: string
      label: Date (free text)
    - name: location
      type: string
      label: Location
    - name: institution
      type: string
      label: Institution (optional)
    - name: associated_project
      type: string
      label: Related project (optional)
      description: Exact project title or existing slug.
    - name: external_link
      type: string
      label: External link (optional)
  - name: education
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title} — {fields.year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
  - name: experience
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title} — {fields.year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
  - name: awards
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title} — {fields.year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
  - name: workshops
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title} — {fields.year}'
    fields:
    - name: year
      type: string
    - name: title
      type: string
    - name: institution
      type: string
    - name: description
      type: text
settings:
  content:
    merge: true
