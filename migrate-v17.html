<!doctype html><html lang="en"><meta charset="utf-8"><title>V17 — Content migration</title><style>body{font:16px Helvetica,Arial,sans-serif;max-width:740px;margin:60px auto;padding:20px;line-height:1.5}button,input{font:inherit}button{padding:10px 16px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px}</style><h1>V17 — Content migration</h1><p>Select the three original JSON files from your repository: projects.json, news.json and notebook.json. They are processed on your computer only. This tool does not modify the originals.</p><input id="files" type="file" multiple accept=".json"><p><button id="run">Create migration ZIP</button></p><pre id="status">Select all three files.</pre><script>
const enc=new TextEncoder();const keys=['projects','news','notebook'];const slug=v=>String(v||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function crc(b){let c=-1;for(const x of b){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^-1)>>>0}
function zip(entries){let offset=0;const parts=[],central=[];for(const [path,content] of entries){const n=enc.encode(path),b=enc.encode(content),sum=crc(b);const h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,sum,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,b);const z=new Uint8Array(46+n.length),w=new DataView(z.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,sum,true);w.setUint32(20,b.length,true);w.setUint32(24,b.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);z.set(n,46);central.push(z);offset+=h.length+b.length}const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,central.reduce((a,b)=>a+b.length,0),true);e.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
document.querySelector('#run').onclick=async()=>{const status=document.querySelector('#status');try{const files=[...document.querySelector('#files').files],entries=[],report=[];for(const k of keys){const f=files.find(f=>f.name===k+'.json');if(!f)throw Error('Missing '+k+'.json');const raw=JSON.parse(await f.text()),list=Array.isArray(raw)?raw:raw?.[k];if(!Array.isArray(list))throw Error(k+'.json is not a list. Recover the original list before migrating.');const used=new Set();for(const [i,item] of list.entries()){if(!item||typeof item!=='object'||Array.isArray(item))throw Error('Invalid item in '+k);const base=slug(k==='projects'?item.slug||item.title:[item.date,item.title].filter(Boolean).join('-'))||'entry-'+(i+1);let name=base,j=2;while(used.has(name))name=base+'-'+j++;used.add(name);const copy={...item};if(k==='projects'&&!copy.slug)copy.slug=name;if(k==='projects'&&!copy.title)throw Error('A project has no title: '+name);if(copy.published===undefined)copy.published=true;entries.push(['content/'+k+'/'+name+'.json',JSON.stringify(copy,null,2)+'\n'])}entries.push(['content/'+k+'/README.md','V17 collection. JSON files are managed in Pages CMS.\n']);report.push(k+': '+list.length+' entries')}entries.push(['content/collections-ready.json',JSON.stringify({enabled:true},null,2)]);const a=document.createElement('a');a.href=URL.createObjectURL(zip(entries));a.download='v17-content-migration.zip';a.click();status.textContent=report.join('\n')+'\n\nUnzip and upload the generated content folder to the repository root. Keep the original JSON files.'}catch(e){status.textContent='Nothing was exported: '+e.message}};
</script></html>
